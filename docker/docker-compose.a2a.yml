services:
  # ─────────────────────────────────────────────────────────────────────────
  # PicoClaw A2A networked agent
  #
  #   MINIMAX_API_KEY=sk-xxx docker compose -f docker/docker-compose.a2a.yml up --build
  #
  #   WebUI:        http://localhost:18800
  #   Gateway/Pico: ws://localhost:18790/pico/ws            (WebSocket chat)
  #   A2A peer:     ws://localhost:18791/a2a/v1/ws          (agent-to-agent)
  #   A2A HTTP:     http://localhost:18791/a2a/v1/ask       (plain POST to run LLM)
  #   mDNS:         _picoclaw-a2a._tcp announced on the LAN (host networking)
  # ─────────────────────────────────────────────────────────────────────────
  picoclaw-a2a:
    build:
      context: ..
      dockerfile: docker/Dockerfile.appbase
    image: picoclaw-appbase:dev
    container_name: picoclaw-a2a
    restart: unless-stopped
    # Host networking is REQUIRED for mDNS: multicast 224.0.0.251 does not cross
    # Docker's bridge NAT, so without this the announce is invisible to the LAN.
    # (Linux only — on macOS/Windows Docker Desktop, mDNS stays container-local.)
    network_mode: host
    environment:
      # Bind the gateway shared HTTP server on all interfaces.
      - PICOCLAW_GATEWAY_HOST=0.0.0.0
      # Optional: a real MINIMAX_API_KEY here takes precedence over the .env file.
      #- MINIMAX_API_KEY=${MINIMAX_API_KEY}
    entrypoint: ["/bin/sh", "/opt/picoclaw/entrypoint-a2a.sh"]
    volumes:
      # Entrypoint shim + config template (read-only).
      - ./entrypoint-a2a.sh:/opt/picoclaw/entrypoint-a2a.sh:ro
      - ../config/config.a2a.json:/root/.picoclaw/config.a2a.template.json:ro
      # Secrets: .env is mounted and loaded by gosdk/config.Default() at startup.
      # Put MINIMAX_API_KEY=... in the repo-root .env (gitignored).
      - ${ENV_FILE:-../.env}:/root/.picoclaw/.env:ro
      # Optional: mount an app folder as the agent workspace (rw). Defaults to
      # an empty named volume so the container is self-contained.
      - ${APP_DIR:-picoclaw-a2a-workspace}:/root/.picoclaw/workspace

volumes:
  picoclaw-a2a-workspace:
